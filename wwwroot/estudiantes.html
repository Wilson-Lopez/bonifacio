<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes | Academia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

    <!-- Menú -->
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>Academia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="instructores.html">Instructores</a></li>
                    <li class="nav-item"><a class="nav-link active" href="estudiantes.html">Estudiantes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/swagger" target="_blank">Swagger <i class="bi bi-box-arrow-up-right small"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <h1 class="h3 mb-0"><i class="bi bi-people-fill text-success me-2"></i>Estudiantes</h1>
                <small class="text-muted" id="contador">Cargando...</small>
            </div>
            <button class="btn btn-success" id="btnNuevo">
                <i class="bi bi-plus-lg me-1"></i>Nuevo estudiante
            </button>
        </div>

        <div class="card">
            <div class="card-body">

                <!-- Buscador y filtro -->
                <div class="row g-2 mb-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="search" class="form-control" id="txtBuscar" placeholder="Buscar por nombre, email o teléfono...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="filtroActivo">
                            <option value="">Todos los estados</option>
                            <option value="true">Solo activos</option>
                            <option value="false">Solo inactivos</option>
                        </select>
                    </div>
                </div>

                <!-- Tabla -->
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Fecha registro</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal: crear / editar -->
    <div class="modal fade" id="modalForm" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="formEstudiante" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Nuevo estudiante</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="alertaError"></div>

                    <input type="hidden" id="txtId">

                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="txtNombres" class="form-label">Nombres *</label>
                            <input type="text" class="form-control" id="txtNombres" maxlength="100" required>
                            <div class="invalid-feedback">Ingrese los nombres.</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="txtApellidos" class="form-label">Apellidos *</label>
                            <input type="text" class="form-control" id="txtApellidos" maxlength="100" required>
                            <div class="invalid-feedback">Ingrese los apellidos.</div>
                        </div>
                        <div class="col-12">
                            <label for="txtEmail" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="txtEmail" maxlength="150" required>
                            <div class="invalid-feedback">Ingrese un email válido.</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="txtTelefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="txtTelefono" maxlength="20" pattern="[0-9+\-\s]*">
                            <div class="invalid-feedback">Solo números, espacios, + o -.</div>
                        </div>
                        <div class="col-sm-6">
                            <label for="txtFechaRegistro" class="form-label">Fecha registro</label>
                            <input type="text" class="form-control" id="txtFechaRegistro" disabled placeholder="Se asigna automáticamente">
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="chkActivo" checked>
                                <label class="form-check-label" for="chkActivo">Activo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success" id="btnGuardar">
                        <i class="bi bi-floppy me-1"></i>Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: confirmar eliminación -->
    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <i class="bi bi-trash3 text-danger display-5"></i>
                    <h5 class="mt-3">¿Eliminar estudiante?</h5>
                    <p class="text-muted mb-0" id="textoEliminar"></p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Sí, eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/estudiantes.js"></script>
</body>
</html>
