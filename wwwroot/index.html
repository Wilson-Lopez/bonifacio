<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | Academia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

    <!-- Menú -->
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html"><i class="bi bi-mortarboard-fill me-2"></i>Academia</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="instructores.html">Instructores</a></li>
                    <li class="nav-item"><a class="nav-link" href="estudiantes.html">Estudiantes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/swagger" target="_blank">Swagger <i class="bi bi-box-arrow-up-right small"></i></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">Sistema de Gestión Académica</h1>
            <p class="text-muted mb-0">Administración de instructores y estudiantes conectada a la API REST.</p>
        </div>

        <div class="row g-4 justify-content-center">

            <div class="col-md-5">
                <a href="instructores.html" class="text-decoration-none text-reset">
                    <div class="card card-resumen h-100">
                        <div class="card-body d-flex align-items-center gap-3 p-4">
                            <div class="icono bg-primary-subtle text-primary"><i class="bi bi-person-video3"></i></div>
                            <div class="flex-grow-1">
                                <div class="text-muted small">Instructores registrados</div>
                                <div class="total" id="totalInstructores">—</div>
                                <div class="small text-success" id="activosInstructores">&nbsp;</div>
                            </div>
                            <i class="bi bi-chevron-right text-muted fs-4"></i>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-5">
                <a href="estudiantes.html" class="text-decoration-none text-reset">
                    <div class="card card-resumen h-100">
                        <div class="card-body d-flex align-items-center gap-3 p-4">
                            <div class="icono bg-success-subtle text-success"><i class="bi bi-people-fill"></i></div>
                            <div class="flex-grow-1">
                                <div class="text-muted small">Estudiantes registrados</div>
                                <div class="total" id="totalEstudiantes">—</div>
                                <div class="small text-success" id="activosEstudiantes">&nbsp;</div>
                            </div>
                            <i class="bi bi-chevron-right text-muted fs-4"></i>
                        </div>
                    </div>
                </a>
            </div>

        </div>

        <div class="text-center mt-5">
            <a href="/swagger" target="_blank" class="btn btn-outline-secondary">
                <i class="bi bi-braces me-1"></i>Ver documentación de la API (Swagger)
            </a>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function cargarResumen(url, idTotal, idActivos) {
            try {
                const lista = await apiRequest(url);
                const activos = lista.filter(x => x.activo).length;
                document.getElementById(idTotal).textContent = lista.length;
                document.getElementById(idActivos).textContent = `${activos} activo(s)`;
            } catch (error) {
                document.getElementById(idTotal).textContent = '!';
                mostrarToast(error.message, 'danger');
            }
        }

        cargarResumen(API.instructores, 'totalInstructores', 'activosInstructores');
        cargarResumen(API.estudiantes, 'totalEstudiantes', 'activosEstudiantes');
    </script>
</body>
</html>
